<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07070a" />
  <meta name="description" content="UltraHype product detail" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="product.css" />
  <title>UltraHype Product</title>
</head>
<body class="product-page">
  <div class="noise" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <header class="site-header shell product-header">
    <a class="brand" href="./" aria-label="UltraHype home">
      <span class="brand-glyph">UH</span>
      <span class="brand-word">ULTRAHYPE</span>
    </a>
    <nav class="product-nav" aria-label="Product navigation">
      <a href="./#products">Products</a>
      <a href="./#hypestacks">HypeStacks</a>
      <a href="./#fshack">FSHack Intelligence</a>
      <a href="./marketplaceOS/">MarketplaceOS</a>
    </nav>
  </header>

  <main id="product-root" class="product-root shell" aria-live="polite">
    <section class="product-loading">
      <span class="kicker">ULTRAHYPE PRODUCT</span>
      <h1>Loading product…</h1>
    </section>
  </main>

  <footer class="site-footer shell">
    <a class="brand" href="./"><span class="brand-glyph">UH</span><span class="brand-word">ULTRAHYPE</span></a>
    <p>© <span id="year"></span> UltraHype. Commerce infrastructure by Highest Degree Priorities LLC.</p>
    <span class="footer-status"><i></i> PRODUCT ENGINE</span>
  </footer>

  <script src="catalog.js"></script>
  <script src="product.js"></script>
</body>
</html>
